name: RCC 3.0 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fp-compiler fp-units-base fp-units-fcl \
            binutils gcc clang make python3 zip unzip
      - name: Clean source build
        run: make clean all
      - name: Full correctness and optimizer suite
        run: make test
      - name: Optimized compiler rebuild
        run: make optimized
      - name: Re-test optimized compiler
        run: make test
      - name: Reproducible package check
        run: make package-check
      - name: Build release archives
        run: make package
      - name: Upload exact source packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcc-3.0.0-source
          path: |
            dist/rcc-3.0.0.tar.gz
            dist/rcc-3.0.0.zip
            dist/rcc-3.0.0.SHA256SUMS
          if-no-files-found: ignore
